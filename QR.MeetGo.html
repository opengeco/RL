<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f3546">
<title>MeetGo</title>
<style>
:root{
  /* palette istituzionale SIAE, la stessa di myPlanner */
  --nero:#000;--p7546:#2f3546;--p533:#2a3a54;--p299:#00b4f9;--bianco:#f6f6f6;--rosso:#a8231b;
  --bg:#e4e6ea;--card:#f6f6f6;--line:rgba(47,53,70,.28);--line2:rgba(47,53,70,.16);--velo:rgba(42,58,84,.15);--mut:#2f3546;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:#000;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(180deg,#000,#2f3546);color:var(--bianco);border-bottom:3px solid var(--p299);padding:12px 16px calc(10px) ;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:22px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .sub{font-size:12.5px;color:#d9dce4}
header button{background:none;border:1px solid var(--bianco);color:var(--bianco);min-height:40px}
main{max-width:760px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 10px}
details.card>summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'+';font-weight:800}details.card[open]>summary::after{content:'−'}
details.card[open]>summary{margin-bottom:10px}
.mut{color:var(--mut)}.small{font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
button{font:inherit;border:1px solid var(--p533);background:#fff;color:var(--p533);border-radius:8px;padding:8px 14px;min-height:44px;font-weight:600;cursor:pointer}
button.pri{background:var(--p299);border-color:var(--p299);color:#000}
button.scuro{background:var(--p533);border-color:var(--p533);color:var(--bianco)}
button.lnk{border:0;background:none;padding:4px 6px;min-height:0;text-decoration:underline;text-underline-offset:2px}
button.rosso{color:var(--rosso);border-color:var(--rosso)}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--p299);outline-offset:1px}
input,select,textarea{font:inherit;font-size:16px;width:100%;border:1px solid var(--p533);border-radius:8px;padding:9px 10px;background:#fff;color:#000;min-height:44px}
textarea{min-height:120px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--p533);flex:none;margin:0}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--velo);font-size:12.5px;font-weight:600}
.chip.b{background:var(--p533);color:var(--bianco)}.chip.cy{background:var(--p299);color:#000}.chip.al{background:var(--rosso);color:var(--bianco)}.chip.k{background:#000;color:var(--bianco)}.chip.t{background:#fff;border:1px solid var(--line)}
.fr{display:grid;grid-template-columns:120px 1fr;gap:6px;padding:6px 0;border-top:1px solid var(--line2)}.fr:first-of-type{border-top:0}
.fr>div:first-child{color:var(--mut);font-size:14px}
.msg{padding:10px 12px;border-radius:8px;background:var(--velo);margin:8px 0;font-size:14px}
.msg.warn{border-left:4px solid var(--p299)}.msg.bad{background:rgba(168,35,27,.12);border-left:4px solid var(--rosso)}
.kp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line2);align-items:center}
.kp:first-of-type{border-top:0}
.kp .n{font-weight:700}.kp .v{font-size:13.5px;color:var(--mut)}
.kp.st{background:#fff;border:2px solid var(--p299);border-radius:8px;padding:9px 10px;margin-bottom:6px}
/* scala a sei colori come in myPlanner */
.k1{background:#a8231b;color:#f6f6f6}.k2{background:#f6f6f6;color:#000;box-shadow:inset 0 0 0 1px #2a3a54}.k3{background:#7bd5f8;color:#000}.k4{background:#00b4f9;color:#000}.k5{background:#1577a7;color:#f6f6f6}.k6{background:#2a3a54;color:#f6f6f6}.k0{background:#e4e6ea;color:#000}
.pc{display:inline-block;min-width:76px;text-align:center;padding:3px 8px;border-radius:4px;font-weight:700;font-size:14px}
.arg{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2);font-size:15px}.arg:first-child{border-top:0}
.az{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.az .g2{margin-top:8px}
.vis{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;color:#000;font-weight:400}
.vis b{font-size:16px}
.barra{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px}
.barra button{flex:1 1 140px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000;color:var(--bianco);padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:92vw;font-size:14px;text-align:center}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto;padding:16px 10px}
.mbox{background:var(--card);max-width:700px;margin:0 auto;border-radius:10px;padding:14px}
pre.mm{white-space:pre-wrap;font:14px/1.5 system-ui,sans-serif;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin:0}
@media (max-width:420px){.g2{grid-template-columns:1fr}.fr{grid-template-columns:1fr}}
</style>
</head>

    var PAD1 = 0x11;

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

        setupTypeNumber(test);
      }

        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )

          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {

          }

              } else {

        } else {

          for (var i = 0; i < rsBlocks.length; i++) {

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';

      qrSvg += '<path d="';

        }
      } );

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';

  var area = 'area ' + String((v.nuova ? C.ar : P.ar) || '').replace(/^./, function (c) { return c.toUpperCase(); });
  var zona = v.nuova ? v.zonaId : P.z;
  return am ? ['myPlanner', area, 'meetgo'] : ['myPlanner', area, 'zona_' + zona, 'rdz', 'meetgo'];
}
function percorso(v) { return h('div', { style: 'font-weight:700;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;word-break:break-word' }, destinazione(v).join(' › ')); }
function istruzioni(v) {
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  return h('div', null,
    h('p', { style: 'margin:0' }, 'Salva il file nella cartella MeetGo su OneDrive:'), percorso(v),
    h('ol', { class: 'small', style: 'margin:6px 0 0;padding-left:20px' }, ios
      ? [h('li', null, 'Premi “Condividi il file” e scegli “Salva in File”.'), h('li', null, 'Apri OneDrive e arriva alla cartella qui sopra (la prima volta creala con il nome “meetgo”).'), h('li', null, 'Premi “Salva”: la volta successiva l’iPhone ripropone la stessa cartella.')]
      : [h('li', null, 'Premi “Condividi il file” e scegli OneDrive.'), h('li', null, 'Arriva alla cartella qui sopra (la prima volta creala con il nome “meetgo”).'), h('li', null, 'Conferma il caricamento.')]),
    h('p', { class: 'mut small', style: 'margin:8px 0 0' }, 'Sul PC il file arriva da solo nella cartella sincronizzata: in myPlanner apri l’uscita, premi “Carica da MeetGo” e sceglilo dalla cartella meetgo.'), diagnosi());
}
/* il file va allegato con “Condividi”, solo il file (senza testo, così in OneDrive non finisce un secondo file).
   Android: prima .txt (Chrome non condivide i .json), poi .json; iPhone: il contrario. myPlanner li legge tutti e due.
   Se il browser non sa dire in anticipo cosa accetta (canShare assente), si prova comunque. */
function android() { return /Android/i.test(navigator.userAgent); }
function fileCandidati(testo, nome) {
  var js = [nome, 'application/json'], tx = [nome.replace(/\.json$/, '.txt'), 'text/plain'];
  return (android() ? [tx, js] : [js, tx]).map(function (p) { try { return new File([testo], p[0], { type: p[1] }); } catch (e) { return null; } }).filter(Boolean);
}
function statoCondivisione() {
  if (!window.isSecureContext) return { ok: false, motivo: 'la pagina non è aperta da un indirizzo https (per esempio è aperta come file dal telefono)' };
  if (!navigator.share) return { ok: false, motivo: 'questo browser non ha la funzione “Condividi” (usa Chrome su Android o Safari su iPhone)' };
  if (navigator.canShare) {
    var f = fileCandidati('{}', 'prova.json').filter(function (x) { try { return navigator.canShare({ files: [x] }); } catch (e) { return false; } });
    if (!f.length) return { ok: false, motivo: 'questo browser condivide il testo ma non i file' };
  }
  return { ok: true };
}
async function invia(E) {
  var testo = JSON.stringify(E, null, 1), nome = nomeFile(E), st = statoCondivisione(), motivo = st.motivo || '';
  if (st.ok) {
    var lista = fileCandidati(testo, nome);
    if (navigator.canShare) lista = lista.filter(function (x) { try { return navigator.canShare({ files: [x] }); } catch (e) { return false; } });
    var f = lista[0];
    if (f) {
      try { await navigator.share({ files: [f] }); return { esito: 'condiviso' }; }
      catch (e) { if (e && e.name === 'AbortError') return null; motivo = 'la condivisione è stata rifiutata (' + ((e && (e.name + (e.message ? ': ' + e.message : ''))) || 'errore') + ')'; }
    }
  }
  var a = h('a', { href: URL.createObjectURL(new Blob([testo], { type: 'application/json' })), download: nome });
  document.body.append(a); a.click(); a.remove();
  return { esito: 'scaricato', motivo: motivo };
}
function diagnosi() {
  var st = statoCondivisione();
  return h('p', { class: 'mut small', style: 'margin:8px 0 0' }, st.ok ? 'Condivisione dei file: disponibile.' : 'Condivisione dei file non disponibile: ' + st.motivo + '. Il file verrà salvato nei download.');
}
/* ---------- QR di ritorno: myPlanner lo legge con la webcam del PC ----------
   ogni QR: 'M' 'G' versione(1) id(2 byte) parte totale compresso(0/1) + dati; oltre 450 byte la relazione si divide in più QR */
var QR_PARTE = 450;
async function partiQr(E) {
  var raw = new TextEncoder().encode(JSON.stringify(E)), b = raw, fl = 0;
  if (typeof CompressionStream === 'function') {
    try { var c = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); if (c.length < raw.length) { b = c; fl = 1; } } catch (e) {}
  }
  var n = Math.max(1, Math.ceil(b.length / QR_PARTE)), id = Math.floor(Math.random() * 65536), out = [];
  if (n > 30) throw new Error('La relazione è troppo lunga per il QR: usa “Condividi il file”');
  for (var i = 0; i < n; i++) {
    var s = String.fromCharCode(0x4D, 0x47, 1, id >> 8, id & 255, i, n, fl), pz = b.subarray(i * QR_PARTE, (i + 1) * QR_PARTE);
    for (var j = 0; j < pz.length; j++) s += String.fromCharCode(pz[j]);
    var q = qrcode(0, 'M'); q.addData(s, 'Byte'); q.make();
    out.push(q.createSvgTag({ cellSize: 4, margin: 16, scalable: true, alt: 'QR per myPlanner, parte ' + (i + 1) + ' di ' + n }));
  }
  return out;
}
async function mostraQrRitorno(v, E, fatto) {
  var qr; try { qr = await partiQr(E); } catch (e) { toast(e.message); return; }
  var i = 0, timer = null, box = h('div', { style: 'background:#fff;border-radius:8px;padding:4px;max-width:440px;margin:0 auto' }), cont = h('div', { class: 'small', style: 'text-align:center;font-weight:700;margin-top:8px' });
  var disegna = function () { box.innerHTML = qr[i]; var sv = box.querySelector('svg'); if (sv) { sv.style.width = '100%'; sv.style.height = 'auto'; sv.style.display = 'block'; } cont.textContent = qr.length > 1 ? 'Parte ' + (i + 1) + ' di ' + qr.length + ' · scorrono da sole' : ''; };
  if (qr.length > 1) timer = setInterval(function () { i = (i + 1) % qr.length; disegna(); }, 900);
  var chiudiQr = function () { if (timer) clearInterval(timer); chiudi(); };
  var chiudi = modale('QR per myPlanner', h('div', null,
    h('p', { class: 'small', style: 'margin:0 0 8px' }, 'Alza la luminosità al massimo. In myPlanner apri ' + (v.nuova ? 'Calendario e premi “Leggi QR visita nuova”' : 'l’uscita ' + ((v.src || {}).c || '') + ' e premi “Leggi QR da MeetGo”') + ', poi tieni il telefono dritto a 20-30 cm dalla webcam.'),
    box, cont,
    h('div', { class: 'row', style: 'margin-top:12px' },
      h('button', { class: 'pri', style: 'flex:1', on: { click: function () { chiudiQr(); if (fatto) fatto(); } } }, 'Fatto: myPlanner l’ha letto'))));
  /* la “Chiudi” della finestra ferma anche lo scorrimento */
  var ov = document.querySelector('.mbg:last-of-type'); if (ov) ov.addEventListener('click', function (e) { if (e.target === ov || (e.target.classList && e.target.classList.contains('lnk'))) { if (timer) clearInterval(timer); } });
  disegna();
}
function conclusa(v, E) { v.stato = 'conclusa'; v.concluso = nowIso(); v.esito = E; salvaVisita(v); riepilogo(v); }
/* “Concludi”: QR da mostrare alla webcam del PC, oppure il file */
function concludi(v) {
  var err = controlla(v); if (err) { toast(err); return; }
  var E = esito(v);
  var chiudi = modale('Concludi la visita', h('div', null,
    h('p', { style: 'margin:0' }, 'In ufficio mostri il QR alla webcam del PC e myPlanner compila l’uscita.'),
    h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'pri', style: 'flex:1', on: { click: function () {
      chiudi(); mostraQrRitorno(v, E, function () { conclusa(v, E); toast('Visita conclusa: in myPlanner controlla il report e invialo'); });
    } } }, 'Mostra il QR per myPlanner')),
    h('details', { style: 'margin-top:14px' }, h('summary', { class: 'small', style: 'cursor:pointer;font-weight:600' }, 'Oppure con il file'), istruzioni(v),
      h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { style: 'flex:1', on: { click: async function () {
        var r = await invia(E);
        if (!r) { toast('Condivisione annullata: la visita resta da concludere'); return; }
        chiudi(); conclusa(v, E);
        toast(r.esito === 'condiviso' ? 'File condiviso: controlla che sia nella cartella meetgo' : 'File salvato nei download perché ' + r.motivo + '. Spostalo nella cartella meetgo');
      } } }, 'Condividi il file')))));
}
function riepilogo(v) {
  testata(titoloVisita(v), 'Conclusa il ' + dIt((v.concluso || '').slice(0, 10)), true);
  var w = h('div', null), E = v.esito || esito(v);
  w.append(h('div', { class: 'msg warn' }, v.nuova ? 'In myPlanner (vista AM): Calendario → “Leggi QR visita nuova” e mostra il QR alla webcam, oppure “Carica visita nuova da MeetGo” con il file.' : 'In myPlanner apri l’uscita ' + (v.src.c || '') + ' → “Leggi QR da MeetGo” e mostra il QR alla webcam, oppure “Carica da MeetGo” con il file. Poi controlla il report e invialo all’AM.'));
  w.append(h('div', { class: 'card' }, h('pre', { class: 'mm' }, verbale(v))));
  w.append(h('div', { class: 'barra' },
    h('button', { class: 'pri', on: { click: function () { mostraQrRitorno(v, E, null); } } }, 'Mostra il QR per myPlanner'),
    h('button', { on: { click: async function () { var r = await invia(Object.assign({}, E)); if (r) toast(r.esito === 'condiviso' ? 'File condiviso di nuovo' : 'File salvato nei download perché ' + r.motivo); } } }, 'Condividi il file'),
    h('button', { on: { click: function () { mostraVerbale(v); } } }, 'Verbale')),
    h('div', { class: 'row', style: 'margin-top:6px' },
      h('button', { class: 'lnk', on: { click: function () { if (!confirm('Riaprire la visita per modificarla? Dopo dovrai mandarla di nuovo a myPlanner.')) return; v.stato = 'bozza'; salvaVisita(v); apri(v.esitoId); } } }, 'Riapri per modificare'), h('span', { class: 'sp' }),
      h('button', { class: 'lnk rosso', on: { click: function () { if (!confirm('Eliminare la visita dal telefono? Fallo solo dopo averla caricata in myPlanner.')) return; togliVisita(v.esitoId); elenco(); } } }, 'Elimina dal telefono')));
  root.replaceChildren(w);
}

/* ---------- avvio ---------- */
(async function () {
  var r = await daLink();
  if (!r) { elenco(); return; }
  if (r.errore) { elenco({ t: r.errore, bad: true }); return; }
  if (r.cfg) { elenco({ t: 'Configurazione ricevuta: ora puoi registrare le visite non programmate (' + r.cfg.ag.length + ' agenzie in ' + r.cfg.zo.length + ' zone).' }); return; }
  apri(r.apri);
  if (r.gia) toast('Visita già sul telefono: ho aggiornato i dati dell’uscita, il tuo lavoro è rimasto');
})();
window.addEventListener('hashchange', function () { location.reload(); });
})();
