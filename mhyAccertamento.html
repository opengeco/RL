const K='myAccertamento_v1',q=x=>document.getElementById(x),groups={Autorale:['MdA.97','79/MdA','97','79/Bis'],Erariale:['93 PVV','93 PVC','93d Apertura','93d Chiusura'],Convenzioni:['97.Sky','79/Sky','97.Mic']};let db=JSON.parse(localStorage.getItem(K)||localStorage.getItem('AccertaGo_v9')||localStorage.getItem('AccertaGo_v7')||'{"a":[],"s":[]}'),draft=[],accountId='',viewId='',detailMetric='assignments',detailPage=1;const save=()=>{localStorage.setItem(K,JSON.stringify(db));render()},uid=p=>p+Date.now()+Math.random().toString(36).slice(2,5),now=()=>new Date().toISOString(),A=id=>db.a.find(a=>a.id===id),cur=()=>db.s.find(s=>s.status==='active'),openM=id=>q(id).classList.add('on'),closeM=id=>q(id).classList.remove('on'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tm=x=>new Date(x).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),fmt=n=>`${Math.floor(n/60)}h ${n%60}m`;function today(){let d=new Date;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}q('bchecks').innerHTML=['MdA','Evento','Erariale','Sky','Mic','Altro'].map(x=>`<label class="check"><input name="bt" type="checkbox" value="${x}">${x}</label>`).join('');q('resultSections').innerHTML=Object.entries(groups).map(([g,ms])=>`<div class="subsection"><h3>${g}</h3><div class="checks">${ms.map(m=>`<label class="check"><input name="rt" type="checkbox" value="${m}">${m}</label>`).join('')}</div></div>`).join('');q('gear').onclick=()=>openM('settings');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');q(b.dataset.v).classList.add('on');render()});
function newAssignment(){draft=[];q('aForm').reset();q('aForm').elements.date.value=today();renderDraft();openM('aModal')}function openBuilder(){q('bv').value='';document.querySelectorAll('[name=bt]').forEach(x=>x.checked=false);openM('builder')}function insertBuilder(){let v=q('bv').value.trim(),t=[...document.querySelectorAll('[name=bt]:checked')].map(x=>x.value);if(!v&&!t.length)return alert('Inserisci almeno un dato.');draft.push({id:uid('P'),venue:v,types:t});renderDraft();closeM('builder')}function renderDraft(){q('draft').innerHTML=draft.map(x=>`<div class="control-card"><b>${esc(x.venue||'Locale non indicato')}</b><div class="muted">${x.types.join(', ')}</div></div>`).join('')}q('aForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);o.id=uid('A');o.town=f.has('town');o.car=f.has('car');o.planned=[...draft];db.a.push(o);save();closeM('aModal')};

function activityCounts(id){let o={};Object.values(groups).flat().forEach(m=>o[m]=0);db.s.filter(s=>s.aid===id).flatMap(s=>s.c||[]).forEach(c=>(c.results||[]).forEach(m=>{if(m in o)o[m]++}));return o}function renderAssignments(){let g={};[...db.a].sort((a,b)=>b.date.localeCompare(a.date)).forEach(a=>(g[a.date.slice(0,7)]??=[]).push(a));q('alist').innerHTML=Object.entries(g).map(([k,v])=>`<h3 class="month">${new Date(k+'-01').toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</h3>`+v.map(a=>`<div class="item"><div class="itemtop"><div><div class="assignment-line" ${a.completed?`onclick="openView('${a.id}')" style="cursor:pointer"`:''}><span>${a.date}</span><span>${esc(a.name)}</span></div><div class="assignment-sub">${esc(a.onBehalf)} · Partner: ${esc(a.partner||'Nessuno')}</div></div>${a.completed?'<span class="toast complete">Completato</span>':''}</div>${a.completed?'':`<div class="assignment-actions"><button class="btn account" onclick="openAccount('${a.id}')">Consuntiva</button><button class="btn secondary" onclick="openView('${a.id}')">Visualizza</button></div>`}</div>`).join('')).join('')||'<div class="muted">Nessun incarico</div>'}function openAccount(id){accountId=id;let a=A(id),c=a.counts||activityCounts(id);q('accountBody').innerHTML=Object.entries(groups).map(([g,ms])=>`<div class="subsection"><h3>${g}</h3>${ms.map(m=>`<div class="counter"><span>${m}</span><div class="stepper"><button onclick="step('${m}',-1)">−</button><input data-m="${m}" type="number" min="0" value="${c[m]||0}"><button onclick="step('${m}',1)">+</button></div></div>`).join('')}</div>`).join('');openM('accountModal')}function step(m,d){let i=[...q('accountBody').querySelectorAll('[data-m]')].find(x=>x.dataset.m===m);i.value=Math.max(0,+i.value+d)}function saveAccount(){let a=A(accountId);a.counts={};q('accountBody').querySelectorAll('[data-m]').forEach(i=>a.counts[i.dataset.m]=Math.max(0,+i.value));a.completed=true;a.completedAt=now();save();closeM('accountModal')}
function isItalianHoliday(d){let md=`${d.getMonth()+1}-${d.getDate()}`,fixed=['1-1','1-6','4-25','5-1','6-2','8-15','11-1','12-8','12-25','12-26'];if(d.getDay()===0||fixed.includes(md))return true;let y=d.getFullYear(),a=y%19,b=Math.floor(y/100),c=y%100,dd=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-dd-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),day=(h+l-7*m+114)%31+1,easter=new Date(y,mo-1,day),monday=new Date(easter);monday.setDate(easter.getDate()+1);return d.toDateString()===monday.toDateString()}
function ztravel(id){let ss=db.s.filter(s=>s.aid===id&&s.end),z={outbound:0,returnTrip:0,work:0,weekdayExtra:0,weekdayNight:0,holidayExtra:0,holidayNight:0,km:0};ss.forEach(s=>{if(s.skm!=null&&s.ekm!=null)z.km+=s.ekm-s.skm;let controls=(s.c||[]).filter(c=>c.start).sort((a,b)=>new Date(a.start)-new Date(b.start));if(controls.length){z.outbound+=Math.max(0,(new Date(controls[0].start)-new Date(s.start))/60000);let last=[...controls].reverse().find(c=>c.end);if(last)z.returnTrip+=Math.max(0,(new Date(s.end)-new Date(last.end))/60000)}let start=new Date(s.start),end=new Date(s.end),workByDay={};for(let t=new Date(start);t<end;t=new Date(t.getTime()+60000)){let next=new Date(Math.min(end,t.getTime()+60000)),mins=(next-t)/60000,night=t.getHours()>=22||t.getHours()<6,holiday=isItalianHoliday(t),dayKey=t.toISOString().slice(0,10);workByDay[dayKey]=workByDay[dayKey]||0;if(holiday){z[night?'holidayNight':'holidayExtra']+=mins}else if(night){z.weekdayNight+=mins}else if(workByDay[dayKey]<447){let w=Math.min(mins,447-workByDay[dayKey]);z.work+=w;workByDay[dayKey]+=w;z.weekdayExtra+=mins-w}else z.weekdayExtra+=mins}});z.transfer=z.outbound+z.returnTrip;return z}
function reportText(id){let a=A(id),z=ztravel(id),c=a.counts||activityCounts(id),locals=db.s.filter(s=>s.aid===id).flatMap(s=>s.c||[]).map(x=>x.venue).filter(Boolean);return `${a.name}\nData: ${a.date}\nPer conto di: ${a.onBehalf}\nPartner: ${a.partner||'Nessuno'}\nKm: ${z.km.toFixed(1)}\nTrasferimento andata: ${fmt(Math.round(z.outbound))}\nTrasferimento ritorno: ${fmt(Math.round(z.returnTrip))}\nTrasferimento totale: ${fmt(Math.round(z.transfer))}\nFeriale lavorativo: ${fmt(Math.round(z.work))}\nFeriale extra: ${fmt(Math.round(z.weekdayExtra))}\nFeriale notturno: ${fmt(Math.round(z.weekdayNight))}\nFestivo extra: ${fmt(Math.round(z.holidayExtra))}\nFestivo notturno: ${fmt(Math.round(z.holidayNight))}\nLocali: ${locals.join(', ')||'Nessuno'}\nModelli: ${Object.entries(c).filter(x=>x[1]>0).map(x=>x.join(': ')).join(', ')||'Nessuno'}`}
async function shareReport(){let text=reportText(viewId);if(navigator.share){try{await navigator.share({title:A(viewId).name,text})}catch(e){}}else{await navigator.clipboard?.writeText(text);alert('Condivisione non disponibile: riepilogo copiato negli appunti.')}}
function openView(id){viewId=id;let a=A(id),c=a.counts||activityCounts(id),z=ztravel(id),locals=db.s.filter(s=>s.aid===id).flatMap(s=>s.c||[]).map(x=>x.venue).filter(Boolean);q('viewTitle').textContent=a.name;q('viewBody').innerHTML=`<div class="subsection"><h3>Dati incarico</h3><div>Data: ${a.date}</div><div>Per conto di: ${esc(a.onBehalf)}</div><div>Partner: ${esc(a.partner||'Nessuno')}</div></div><div class="subsection ztravel"><h3>ZTravel</h3><div class="zrow"><span>Km</span><b>${z.km.toFixed(1)}</b></div><div class="zrow"><span>Trasferimento - Andata</span><b>${fmt(Math.round(z.outbound))}</b></div><div class="zrow"><span>Trasferimento - Ritorno</span><b>${fmt(Math.round(z.returnTrip))}</b></div><div class="zrow"><span>Trasferimento - Totale</span><b>${fmt(Math.round(z.transfer))}</b></div><div class="zrow"><span>Feriale - Orario lavorativo (7h 27m)</span><b>${fmt(Math.round(z.work))}</b></div><div class="zrow"><span>Feriale - Extra lavorativo (06:00-22:00)</span><b>${fmt(Math.round(z.weekdayExtra))}</b></div><div class="zrow"><span>Feriale - Notturno (22:00-06:00)</span><b>${fmt(Math.round(z.weekdayNight))}</b></div><div class="zrow"><span>Festivo - Extra lavorativo (06:00-22:00)</span><b>${fmt(Math.round(z.holidayExtra))}</b></div><div class="zrow"><span>Festivo - Notturno (22:00-06:00)</span><b>${fmt(Math.round(z.holidayNight))}</b></div></div>${locals.length?`<div class="subsection"><h3>Locali</h3>${locals.map((x,i)=>`<div class="counter"><span>${i+1}. ${esc(x)}</span></div>`).join('')}</div>`:''}`+Object.entries(groups).filter(([g,ms])=>ms.some(m=>(c[m]||0)>0)).map(([g,ms])=>`<div class="subsection"><h3>${g}</h3>${ms.filter(m=>(c[m]||0)>0).map(m=>`<div class="counter"><span>${m}</span><b>${c[m]}</b></div>`).join('')}</div>`).join('');openM('viewModal')}
function last12(){let out=[];let d=new Date();d.setDate(1);for(let i=11;i>=0;i--){let x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({key:`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`,label:x.toLocaleDateString('it-IT',{month:'short'})})}return out}function closed(){return db.s.filter(s=>s.status==='closed')}function metricData(metric){let ss=closed(),months=last12(),isModel=metric.startsWith('model:');let model=isModel?metric.slice(6):'';return months.map(m=>{let rows=ss.filter(s=>s.start?.slice(0,7)===m.key),v;if(isModel)v=rows.flatMap(s=>s.c||[]).filter(c=>(c.results||[]).includes(model)).length;else v=metric==='assignments'?rows.length:metric==='hours'?rows.reduce((t,s)=>t+(new Date(s.end)-new Date(s.start))/3600000,0):rows.reduce((t,s)=>t+(s.ekm!=null&&s.skm!=null?s.ekm-s.skm:0),0);return {...m,v}})}
function openDetail(metric){detailMetric=metric;detailPage=1;renderDetail();openM('detailModal')}
function renderDetail(){let isModel=detailMetric.startsWith('model:'),model=isModel?detailMetric.slice(6):'',titles={assignments:'Accertamenti',hours:'Ore di accertamento',km:'Chilometri'},data=metricData(detailMetric),max=Math.max(1,...data.map(x=>x.v));q('detailTitle').textContent=(isModel?model:titles[detailMetric])+' · ultimi 12 mesi';q('detailChart').innerHTML=`<div class="chart">${data.map(x=>`<div class="barwrap"><div class="bar" title="${x.v.toFixed(1)}" style="height:${Math.max(2,x.v/max*100)}%"></div><span class="barlabel">${x.label}</span></div>`).join('')}</div>`;let all;if(isModel){all=closed().flatMap(s=>(s.c||[]).filter(c=>(c.results||[]).includes(model)).map(c=>({session:s,control:c}))).sort((a,b)=>new Date(b.control.start)-new Date(a.control.start))}else{all=closed().sort((a,b)=>new Date(b.start)-new Date(a.start))}let pages=Math.max(1,Math.ceil(all.length/20)),slice=all.slice((detailPage-1)*20,detailPage*20);if(isModel){q('detailTable').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Incarico</th><th>Locale</th><th>Modello</th><th>Note</th></tr></thead><tbody>${slice.map(r=>`<tr><td>${new Date(r.control.start).toLocaleDateString('it-IT')}</td><td>${esc(A(r.session.aid)?.name||'')}</td><td>${esc(r.control.venue||'Non indicato')}</td><td>${esc(model)}</td><td>${esc(r.control.notes||'')}</td></tr>`).join('')}</tbody></table></div>${pagerHtml(pages)}`}else{q('detailTable').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Incarico</th><th>Durata</th><th>Km</th><th>Controlli</th></tr></thead><tbody>${slice.map(s=>`<tr><td>${new Date(s.start).toLocaleDateString('it-IT')}</td><td>${esc(A(s.aid)?.name||'')}</td><td>${fmt(Math.round((new Date(s.end)-new Date(s.start))/60000))}</td><td>${s.ekm!=null&&s.skm!=null?(s.ekm-s.skm).toFixed(1):'N/D'}</td><td>${(s.c||[]).length}</td></tr>`).join('')}</tbody></table></div>${pagerHtml(pages)}`}}
function pagerHtml(pages){return `<div class="pager"><button class="btn secondary" ${detailPage<=1?'disabled':''} onclick="detailPage--;renderDetail()">‹</button><span>${detailPage} / ${pages}</span><button class="btn secondary" ${detailPage>=pages?'disabled':''} onclick="detailPage++;renderDetail()">›</button></div>`}
function renderTrend(){let ss=closed(),mins=ss.reduce((t,s)=>t+Math.round((new Date(s.end)-new Date(s.start))/60000),0),kms=ss.reduce((t,s)=>t+(s.ekm!=null&&s.skm!=null?s.ekm-s.skm:0),0),months=Math.max(1,new Set(ss.map(s=>s.start?.slice(0,7)).filter(Boolean)).size),counts={};Object.values(groups).flat().forEach(m=>counts[m]=0);ss.flatMap(s=>s.c||[]).forEach(c=>(c.results||[]).forEach(m=>counts[m]=(counts[m]||0)+1));q('trendBody').innerHTML=`<div class="kpis"><div class="type-card" onclick="openDetail('assignments')"><b>${ss.length}</b><small>Accertamenti</small></div><div class="type-card" onclick="openDetail('assignments')"><b>${(ss.length/months).toFixed(1)}</b><small>Media mensile accertamenti</small></div><div class="type-card" onclick="openDetail('hours')"><b>${fmt(mins)}</b><small>Ore e minuti</small></div><div class="type-card" onclick="openDetail('hours')"><b>${fmt(Math.round(mins/months))}</b><small>Media mensile ore</small></div><div class="type-card" onclick="openDetail('km')"><b>${kms.toFixed(1)}</b><small>Km</small></div><div class="type-card" onclick="openDetail('km')"><b>${(kms/months).toFixed(1)}</b><small>Media mensile km</small></div></div><h3>Controlli per modello</h3><div class="type-grid">${Object.entries(counts).filter(([m,n])=>n>0).map(([m,n])=>`<div class="type-card" onclick="openDetail('model:${m}')"><b>${n}</b><small>${m}</small></div>`).join('')||'<div class="muted">Nessun controllo consuntivato</div>'}</div>`}
function render(){let s=cur(),a=s?A(s.aid):null,oc=s?.c.find(c=>!c.end);q('start').disabled=!!s;q('cs').disabled=!s||!!oc;q('ce').disabled=!oc;q('finish').disabled=!s||!!oc;q('activeName').innerHTML=s?esc(a.name)+'<span class="toast">● In corso</span>':'Nessun accertamento';q('summaryName').textContent=s?a.name:'';q('count').textContent=s?s.c.length:0;q('timeline').innerHTML=s?s.ev.map(e=>`<div class="ev"><b>${e.l}</b> <small>${tm(e.t)} ${esc(e.d||'')}</small></div>`).join(''):'';renderAssignments();renderTrend();elapsed()}function elapsed(){let s=cur();if(!s)return q('elapsed').textContent='00:00';let m=Math.floor((Date.now()-new Date(s.start))/60000);q('elapsed').textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function exportJ(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='myAccertamento.json';a.click()}q('backup').onchange=e=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save()}catch{alert('JSON non valido')}};r.readAsText(e.target.files[0])};setInterval(elapsed,1000);render();
</script></body></html>
