ralo con la fotocamera del telefono e tocca il link: si apre myVisit con la visita già pronta.</li></ol><p>Nella visita trovi agenzia, zona, data e ora programmate, mandatario (o reggente), obiettivo e i KPI dell’agenzia.</p><p>Se inquadri di nuovo il QR di una visita che hai già sul telefono, myVisit aggiorna i dati dell’uscita e lascia com’è quello che avevi scritto.</p><p>Per aprire il link del QR serve la connessione; una volta aperta, la visita si compila anche se la rete cade.</p>'},{id:"compila",tit:"Compilare la visita",ruoli:["rdz","am"],testo:'<p>Tutto quello che scrivi si salva da solo sul telefono (in fondo vedi <b class="bt">✓ Salvata sul Telefono</b>).</p><ol><li><b>Quando è stata fatta</b>: la data effettiva (non può essere nel futuro) e l’ora. <b class="bt">Adesso</b> mette l’ora attuale. Se la data è dopo quella programmata, myVisit segnala il ritardo.</li><li><b>Argomenti trattati</b>: spunta quelli di cui avete parlato.</li><li><b>Cosa è emerso</b>: fatti, numeri, impegni presi. È obbligatorio.</li><li><b>Azioni</b>: con <b class="bt">+ Azione</b> aggiungi una cosa da fare. Ogni azione vuole il testo e la data <b>Entro il</b>; il <b>KPI collegato</b> è facoltativo. <b class="bt">Togli</b> la cancella.</li></ol><p data-ruolo="rdz">Quando l’AM risponde al report in myPlanner, ogni azione diventa una tua attività con la sua scadenza.</p><p>In fondo alla pagina:</p><ul><li><b class="bt">Invia a myPlanner</b>: prepara la mail (vedi “Inviare a myPlanner”).</li><li><b class="bt">Annulla</b>: cancella quello che hai scritto (data, argomenti, cosa è emerso, azioni). La visita resta nell’elenco; una visita nuova invece si toglie.</li><li><b class="bt">Elimina dal Telefono</b>: toglie la visita dal telefono. Quello che non hai inviato si perde.</li></ul>'},{id:"kpi",tit:"Leggere i KPI dell’agenzia",ruoli:["rdz","am"],testo:"<p>In alto ci sono i <b>KPI da stimolare</b> scelti in myPlanner per questa uscita; sotto, chiusi, <b>Tutti i KPI dell’agenzia</b>.</p><ul><li>Il numero colorato è la <b>% del ritmo</b>: quanto l’agenzia è avanti rispetto a dove dovrebbe essere oggi (valore ÷ obiettivo ÷ ritmo atteso). 100% vuol dire in linea.</li><li>I colori sono gli stessi di myPlanner: dal rosso (in forte ritardo) al blu scuro (avanti).</li><li><b>Validate</b>: il raggiungimento del tetto (meno pratiche da gestire è meglio). <b>TuneX</b>: la media rispetto alla soglia.</li><li>Sotto ogni KPI: valore, obiettivo e % del target. In fondo la data del report KPI usato.</li></ul><p>I KPI sono quelli del giorno in cui hai fatto il QR: per averli più recenti rifai il QR da myPlanner.</p>"},{id:"nuova",tit:"Visita non programmata",ruoli:["am"],testo:'<p>Serve per registrare una visita che non era in calendario. Una volta sola, e poi quando cambiano zone o agenzie:</p><ol><li>In myPlanner, nel Calendario, premi <b class="bt">myVisit per le visite nuove</b> e inquadra il QR: myVisit ricorda zone, agenzie, tipi di visita e argomenti.</li><li>Nella schermata iniziale di myVisit tocca <b class="bt">+ Nuova visita</b>.</li><li>In <b>Dove</b> scegli la zona, l’agenzia (o <b>— altro luogo —</b> e scrivi il luogo) e il tipo di visita.</li><li>Poi si compila come una visita normale e si invia con <b class="bt">Invia a myPlanner</b>.</li></ol><p>Nell’elenco le visite nuove hanno una stellina rossa. In myPlanner si caricano dal Calendario con <b class="bt">Carica visita nuova da myVisit</b> e diventano una tua uscita.</p>'},{id:"invia",tit:"Inviare a myPlanner",ruoli:["rdz","am"],testo:'<ol><li>Tocca <b class="bt">Invia a myPlanner</b>. Se manca qualcosa (data, cosa è emerso, la data di un’azione…) myVisit te lo dice e non invia.</li><li>Si apre la mail già pronta, con destinatario e oggetto (il codice dell’uscita).</li><li>Premi <b>Invia</b> in Outlook <b>senza modificare il testo</b>: è la visita cifrata, solo myPlanner sa leggerla.</li></ol><p>Se la visita è troppo lunga per il corpo della mail, o manca l’indirizzo, si apre <b>Invia come allegato</b>: tocca <b class="bt">Allega il file</b>, scegli Outlook e manda la mail allo stesso indirizzo con lo stesso oggetto (ci sono <b class="bt">Copia indirizzo</b> e <b class="bt">Copia oggetto</b>).</p><p>La mail viene salvata nella cartella di myPlanner. Da lì, in myPlanner, la carichi nel Calendario con <b class="bt">Rendicontazioni myVisit</b>, oppure dalla scheda dell’uscita con <b class="bt">Carica da myVisit</b>.</p>'},{id:"dopo",tit:"Dopo l’invio: riepilogo e visite salvate",ruoli:["rdz","am"],testo:'<p>Dopo l’invio la visita mostra il <b>Riepilogo della Visita</b> e nell’elenco diventa <b>inviata a myPlanner</b>.</p><ul><li>Controlla in Outlook che la mail sia partita. Se non è partita tocca <b class="bt">Invia di nuovo</b>.</li><li><b class="bt">Riapri per modificare</b>: torna a bozza; dopo le modifiche va inviata di nuovo.</li><li><b class="bt">Elimina dal Telefono</b>: fallo solo quando hai ritrovato la visita in myPlanner.</li></ul><p>Invia la visita lo stesso giorno: se il browser cancella i dati del sito (pulizia, cambio di telefono o di browser), quello che non hai inviato si perde.</p>'},{id:"calendario",tit:"Il calendario del mese",ruoli:["rdz","am"],testo:'<p><b>Per caricarlo</b>: in myPlanner, nella home (<span data-ruolo="rdz">Oggi</span><span data-ruolo="am">Riepilogo</span>), premi <b class="bt">Calendario su myVisit</b> e inquadra il QR. Se i QR sono due, inquadrali uno dopo l’altro: myVisit li rimette insieme.</p><p><b>Cosa contiene</b>: il mese in corso, <span data-ruolo="rdz">con le tue uscite, le riunioni e le call della zona, le uscite e le riunioni dell’AM nella tua zona, le tue ferie e il tuo smart working, le festività, le attività da fare.</span><span data-ruolo="am">con le tue uscite e riunioni, le tue ferie e il tuo smart working, le festività, le attività da fare.</span></p><ul><li>Nella griglia ogni colore o motivo è un tipo di giorno (vedi la legenda sotto la griglia); i puntini sono gli impegni. Tocca un giorno per andare al suo elenco.</li><li><b>Giorno per giorno</b> elenca uscite, riunioni e attività; <b>Attività ricorrenti da fare</b> quelle che si ripetono.</li><li data-ruolo="rdz">“Assenza” indica un giorno registrato dall’AM: il dettaglio è riservato e non compare qui.</li><li>È solo da guardare: per cambiare qualcosa usa myPlanner e rifai il QR.</li></ul><p>Se è cambiato il mese, o il calendario ha più di 3 giorni, myVisit te lo dice: rifai il QR.</p>'},{id:"faq",tit:"Domande frequenti",ruoli:["rdz","am"],testo:'<p><b>Ho inquadrato il QR ma dice “non riconosciuti”.</b> myVisit e myPlanner sono di versioni diverse: chiedi la versione aggiornata.</p><p><b>“Visita già sul telefono”.</b> Hai rifatto il QR di una visita che avevi già: i dati dell’uscita sono aggiornati, quello che avevi scritto è rimasto.</p><p><b>Cambio telefono o browser.</b> Le visite stanno nel browser di questo telefono: inviale tutte prima di cambiare.</p><p><b>Si può lavorare senza rete?</b> Sì per compilare. Per aprire il link del QR serve la rete; la mail parte quando la rete torna.</p><p><b>Chi legge la mail?</b> Il testo è cifrato: myVisit sa solo chiuderlo, lo apre solo myPlanner. Nel report ci sono solo dati oggettivi della visita.</p><p><b>Ho sbagliato e ho già inviato.</b> Apri la visita, <b class="bt">Riapri per modificare</b>, correggi e invia di nuovo: al caricamento myPlanner chiede se sostituire il report. <span data-ruolo="rdz">Se il report è già stato inviato all’AM non si sostituisce più: avvisa l’AM.</span></p>'}];!async function(){var a=await async function(){var a,e=(location.hash||"").match(/^#([dck])=(.+)$/);if(!e)return null;try{history.replaceState(null,"",location.pathname+location.search)}catch(a){}if("k"===e[1]){var i=e[2];if("p"===i.charAt(0)){var s=i.slice(1).split("."),c=s[0],u=+s[1],d=+s[2],p=P(r)||{};if(!c||!u||!d)return{errore:"QR del calendario non riconosciuto"};p[c]||(p={}),p[c]=p[c]||{n:d,p:{}},p[c].p[u]=s.slice(3).join("."),A(r,p);var v=Object.keys(p[c].p).length;if(v<d)retu
