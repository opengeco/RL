name: Agente eventi

on:
  schedule:
    # Orario in UTC: 05:17 UTC = 07:17 in Italia (ora legale) / 06:17 (ora solare)
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agente-eventi
  cancel-in-progress: false

jobs:
  eventi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests anthropic

      - name: Esegui agente
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          # Facoltativo: se il secret non esiste l'agente usa l'estrazione gratuita a regole
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python eventi/agente.py

      - name: Salva eventi.json
        run: |
          git config user.name "agente-eventi"
          git config user.email "agente-eventi@users.noreply.github.com"
          git add eventi/eventi.json
          git diff --cached --quiet || git commit -m "eventi: aggiornamento automatico"
          git push
