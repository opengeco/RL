<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b1a"><title>Eventi</title><style>
:root{--bg:#0d0b1a;--panel:#1a1631;--panel2:#120f24;--line:#2e2850;--text:#f7f6fc;--muted:#b3adc9;--accent:#c39bff;--pink:#ff6fae;--amber:#ffc857}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#3a1f6e 0,transparent 36%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1050px,calc(100% - 24px));margin:auto;padding:24px 0 40px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:.75rem;font-weight:900;letter-spacing:.14em}h1{margin:0;font-size:clamp(2rem,6vw,3.6rem);line-height:1}.updated{color:var(--muted);font-size:.78rem}.search{width:100%;margin-top:20px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#17132c;color:var(--text);font-size:.95rem}.tabs,.chips{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.tabs{margin:16px 0 4px}.tab,.chip{border:1px solid var(--line);border-radius:999px;background:#16122a;color:var(--muted);padding:9px 15px;font-weight:800;white-space:nowrap;cursor:pointer}.chip{padding:6px 12px;font-size:.78rem}.tab[aria-pressed=true]{background:#fff;color:#0d0b1a}.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#1a0d33}.day{margin-top:22px}.day h2{font-size:1.02rem;margin:0 0 10px;text-transform:capitalize}.grid{display:grid;gap:12px}.card{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;padding:16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel),var(--panel2))}.thumb{width:76px;height:76px;border-radius:12px;object-fit:cover;background:#251f45}.time{font-size:1.3rem;font-weight:900}.titleRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.title{font-size:1.2rem;font-weight:900}.cat{border-radius:999px;padding:4px 9px;font-size:.66rem;font-weight:900;text-transform:uppercase;background:#3d3566}.cat.live,.cat.concerto{background:#b8336a}.cat.djset{background:#6a3ddb}.cat.festival{background:#c76a12}.cat.party{background:#1d7a8c}.meta{margin-top:6px;color:var(--muted);font-size:.84rem;line-height:1.45}.meta b{color:var(--text)}.link{display:inline-block;margin-top:8px;color:var(--accent);font-weight:800;font-size:.82rem;text-decoration:none}.empty,.loading,.error{margin-top:22px;padding:26px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}@media(max-width:560px){.card{grid-template-columns:60px 1fr}.thumb{width:60px;height:60px}.title{font-size:1.05rem}}
</style></head><body><div class="wrap">
<header><div><p class="eyebrow">AGENTE EVENTI</p><h1>Eventi</h1></div><div class="updated" id="updated"></div></header>
<input class="search" id="q" type="search" placeholder="Cerca locale, artista, città…">
<div class="tabs" id="tabs"><button class="tab" data-r="oggi" aria-pressed="true">Oggi</button><button class="tab" data-r="weekend" aria-pressed="false">Weekend</button><button class="tab" data-r="7" aria-pressed="false">7 giorni</button><button class="tab" data-r="tutti" aria-pressed="false">Tutti</button></div>
<div class="chips" id="chips"></div>
<main id="content"><div class="loading">Caricamento eventi…</div></main>
</div><script>
const DATA='./eventi/eventi.json';let eventi=[],range='oggi',cat='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function inRange(e){const t=new Date();t.setHours(0,0,0,0);const oggi=iso(t);if(range==='oggi')return e.data===oggi;if(range==='7'){const f=new Date(t);f.setDate(t.getDate()+7);return e.data>=oggi&&e.data<=iso(f)}if(range==='weekend'){const w=t.getDay(),ven=new Date(t);ven.setDate(t.getDate()+(w===0?-2:5-w));const dom=new Date(ven);dom.setDate(ven.getDate()+2);return e.data>=iso(w===0||w>=5?t:ven)&&e.data<=iso(dom)}return e.data>=oggi}
function card(e){const img=e.immagine?`<img class="thumb" src="${esc(e.immagine)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb'}))">`:'<div class="thumb"></div>';const dove=[e.luogo,e.citta].filter(Boolean).join(' · ');return `<article class="card">${img}<div><div class="titleRow">${e.ora?`<span class="time">${esc(e.ora)}</span>`:''}<span class="title">${esc(e.titolo)}</span><span class="cat ${norm(e.categoria).replace(/\s/g,'')}">${esc(e.categoria)}</span></div><div class="meta">${dove?`📍 <b>${esc(dove)}</b><br>`:''}${e.artisti?.length?`🎧 ${esc(e.artisti.join(', '))}<br>`:''}${e.prezzo?`🎟️ ${esc(e.prezzo)}<br>`:''}da @${esc(e.account)}</div>${e.link?`<a class="link" href="${esc(e.link)}" target="_blank" rel="noopener">Vedi post ↗</a>`:''}</div></article>`}
function render(){const q=norm($('#q').value.trim());const a=eventi.filter(e=>inRange(e)&&(!cat||e.categoria===cat)&&(!q||norm([e.titolo,e.luogo,e.citta,e.account,e.nome_account,(e.artisti||[]).join(' ')].join(' ')).includes(q)));if(!a.length){$('#content').innerHTML='<div class="empty">Nessun evento trovato per questo filtro.</div>';return}const g={};a.forEach(e=>(g[e.data]=g[e.data]||[]).push(e));$('#content').innerHTML=Object.keys(g).sort().map(d=>{const dt=new Date(d+'T12:00');return `<section class="day"><h2>${dt.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})} · ${g[d].length}</h2><div class="grid">${g[d].map(card).join('')}</div></section>`}).join('')}
function chips(){const c=[...new Set(eventi.map(e=>e.categoria).filter(Boolean))].sort();$('#chips').innerHTML=['',...c].map(x=>`<button class="chip" data-c="${esc(x)}" aria-pressed="${x===cat}">${x?esc(x):'Tutte'}</button>`).join('');$('#chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;chips();render()})}
$('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{range=b.dataset.r;$('#tabs').querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});$('#q').oninput=render;
(async()=>{try{const r=await fetch(DATA+'?v='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);const x=await r.json();eventi=x.eventi||[];$('#updated').textContent=x.aggiornato?'Aggiornato '+new Date(x.aggiornato).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'}):'Mai aggiornato';chips();render()}catch(e){$('#content').innerHTML='<div class="error">Impossibile caricare eventi.json: '+esc(e.message)+'</div>'}})();
</script></body></html>
